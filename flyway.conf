# === Database Connection Settings ===
flyway.url=jdbc:postgresql://172.18.102.2:5432/${POSTGRES_DB}
flyway.user=${POSTGRES_USER}
flyway.password=${POSTGRES_PASSWORD}

# === Migration Settings ===
# Location of migration scripts
flyway.locations=filesystem:./migrations/sql

# Schema to use for Flyway's metadata table
# IMPORTANT: Use a different table name to avoid conflicts with n8n
flyway.table=app_flyway_schema_history

# Schemas to manage (optional - creates if doesn't exist)
# flyway.schemas=app

# Default schema for your application tables
# flyway.defaultSchema=app

# === Migration Naming ===
# Migration file naming pattern: V{version}__{description}.sql
# Example: V001__create_customers_table.sql
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Repeatable migrations (run on every migrate if changed)
flyway.repeatableSqlMigrationPrefix=R

# === Baseline Settings ===
# Use if you're adding Flyway to existing database
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Initial baseline

# === Validation ===
# Validate migrations before running
flyway.validateOnMigrate=true

# Allow mixing transactional and non-transactional statements
flyway.mixed=false

# === Placeholders ===
# Use placeholders in your SQL files
flyway.placeholderReplacement=true
flyway.placeholderPrefix=${
flyway.placeholderSuffix=}

# Custom placeholders (optional)
flyway.placeholders.appSchema=app
flyway.placeholders.environment=production

# === Safety Settings ===
# Prevent accidental data loss
flyway.cleanDisabled=true

# Allow out of order migrations (use with caution)
flyway.outOfOrder=false

# === Logging ===
# Set log level: debug, info, warn
flyway.logLevel=debug

# === Connection Pool Settings ===
# Maximum number of retries when attempting to connect
flyway.connectRetries=3

# Maximum time to wait for database connection (seconds)
flyway.connectRetriesInterval=5
